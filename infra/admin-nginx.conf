# admin-web 静态托管（SPA history 路由回退）
# Caddy 侧 handle_path /admin/* 剥前缀后转发到本容器
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 产物带 hash，长缓存；index.html 不缓存保证发版即生效
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
