# 生产部署编排（服务器 /opt/b2c-distributor/ 下使用）
# 密钥经同目录 .env 注入，.env 不入库（AGENTS.md §6）
services:
  db:
    image: docker.m.daocloud.io/library/mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      IDCARD_AES_KEY: ${IDCARD_AES_KEY}
      JWT_EXPIRES_IN: 7d
      WX_APPID: ${WX_APPID}
      WX_SECRET: ${WX_SECRET}
      WXPAY_MCHID: ${WXPAY_MCHID}
      WXPAY_SERIAL: ${WXPAY_SERIAL}
      WXPAY_APIV3_KEY: ${WXPAY_APIV3_KEY}
      WXPAY_PRIVATE_KEY_PATH: ${WXPAY_PRIVATE_KEY_PATH}
      WXPAY_NOTIFY_URL: ${WXPAY_NOTIFY_URL}
      WXPAY_PUBLIC_KEY_PATH: ${WXPAY_PUBLIC_KEY_PATH}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
      # 微信支付商户私钥（apiclient_key.pem）放宿主机 infra/certs/，只读挂载，不入镜像不入库
      - ./certs:/app/certs:ro
    # 绑定 docker 网关 IP：宿主 Caddy 以 172.19.0.1:3020 反代（与 test1 模式一致）
    ports:
      - "172.19.0.1:3020:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
  uploads:
