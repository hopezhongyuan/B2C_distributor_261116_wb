# 生产部署编排（服务器 /opt/b2c-distributor/ 下使用）
# 密钥经同目录 .env 注入，.env 不入库（AGENTS.md §6）
services:
  db:
    image: docker.m.daocloud.io/library/mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      IDCARD_AES_KEY: ${IDCARD_AES_KEY}
      JWT_EXPIRES_IN: 7d
      WX_APPID: ${WX_APPID}
      WX_SECRET: ${WX_SECRET}
      WXPAY_MCHID: ${WXPAY_MCHID}
      WXPAY_SERIAL: ${WXPAY_SERIAL}
      WXPAY_APIV3_KEY: ${WXPAY_APIV3_KEY}
      WXPAY_PRIVATE_KEY_PATH: ${WXPAY_PRIVATE_KEY_PATH}
      WXPAY_NOTIFY_URL: ${WXPAY_NOTIFY_URL}
      WXPAY_PUBLIC_KEY_PATH: ${WXPAY_PUBLIC_KEY_PATH}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
      # 微信支付商户私钥（apiclient_key.pem）放宿主机 infra/certs/，只读挂载，不入镜像不入库
      - ./certs:/app/certs:ro
    # 绑定 docker 网关 IP：宿主 Caddy 以 172.19.0.1:3020 反代（与 test1 模式一致）
    ports:
      - "172.19.0.1:3020:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # OOM 防护：Node 堆上限 + 容器内存约束，防拖垮宿主机
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # admin-web 静态托管：构建产物放宿主 /opt/b2c-distributor/admin-dist（scp 上传，不入镜像）
  # Caddy 侧 handle_path /admin/* 反代到 172.19.0.1:3022
  admin:
    image: docker.m.daocloud.io/library/nginx:alpine
    restart: unless-stopped
    volumes:
      - ../admin-dist:/usr/share/nginx/html:ro
      - ./admin-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "172.19.0.1:3022:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  mysql-data:
  uploads:
